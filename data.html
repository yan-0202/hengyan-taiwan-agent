<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2712%27 fill=%27%237361d9%27/%3E%3Cpath d=%27M10 28V13M10 28H30M14 22L20 16L25 19L31 11%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>官方資料中心｜衡研</title><link rel="stylesheet" href="/assets/ui.css"><script type="module" src="/assets/ui.mjs"></script><main><nav><a href="/">市場總覽</a><a href="/workspace">團隊研究</a><a href="/ai">AI 配置</a><a href="/research">研究工具</a></nav><h1>官方資料中心</h1><p>從交易所、櫃買中心與中央銀行取得公開數據。更新不呼叫 AI。</p><button id="refresh">更新全部官方市場與總經資料</button><div id="status" role="status" aria-live="polite"></div><div id="warnings"></div><section><h2>市值前十大公司</h2><p id="scope"></p><p id="coverage"></p><div id="ranking" class="scroll"></div></section><section><h2>總體經濟觀測</h2><p>匯率為歷史觀測；政策利率為最後生效日。資料期間、資料庫更新日與下載時間分別列示。</p><div id="macro"></div></section><section><h2>全部可取得的收盤指數</h2><label for="filter">搜尋指數名稱／類別</label><input id="filter" placeholder="加權、電子、金融、報酬…"><p id="count"></p><div id="indices" class="scroll"></div></section><section><h2>來源與更新狀態</h2><div id="sources"></div></section><section><h2>主動觀測與事件紀錄</h2><p>只在這台電腦的後端持續開啟時執行；預設關閉。不呼叫 AI、不下單，不提供手機推播。</p><label><input id="monitor-enabled" type="checkbox" style="width:auto"> 啟用定時官方資料更新與門檻檢查</label><label for="monitor-interval">每隔幾分鐘檢查（至少 15 分鐘）</label><input id="monitor-interval" type="number" min="15" max="10080" value="360"><label for="monitor-threshold">核心指數收盤漲跌幅門檻（± %）</label><input id="monitor-threshold" type="number" min="0.1" max="30" step="0.1" value="3"><button id="monitor-save">保存觀測設定</button> <button id="monitor-check">立即更新並檢查（免費資料）</button><p id="monitor-status" role="status"></p><div id="events"></div></section></main><script type="module">
const $=s=>document.querySelector(s),el=(t,text)=>{const x=document.createElement(t);if(text!=null)x.textContent=text;return x};let current;
const fmt=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:3}):'缺值';
function table(headers,rows){const t=el('table'),head=el('thead'),tr=el('tr');tr.append(...headers.map(h=>el('th',h)));head.append(tr);const b=el('tbody');for(const r of rows){const row=el('tr');row.append(...r.map(v=>el('td',v)));b.append(row)}t.append(head,b);return t}
function render(d){current=d;$('#scope').textContent=d.ranking.scope+' '+d.ranking.note;$('#coverage').textContent=`行情日 ${d.marketDate??'未取得'} · 已比對上市 ${d.ranking.coverage.listed} 家、上櫃 ${d.ranking.coverage.otc} 家`;
$('#warnings').replaceChildren(...d.warnings.map(w=>{const p=el('p',w);p.className='notice';return p}));
$('#ranking').replaceChildren();for(const [name,rows] of d.ranking.complete?[['上市＋上櫃',d.ranking.combined]]:[['上市（資料不足時不代表全市場）',d.ranking.listed],['上櫃',d.ranking.otc]]){$('#ranking').append(el('h3',name),table(['名次','代號','公司','市場','市值（億元）','收盤價','資料日'],rows.map(r=>[r.rank,r.code,r.name,r.market,fmt(r.marketCap/1e8),fmt(r.close),r.date])))}
$('#macro').replaceChildren(...d.macro.map(m=>{const s=el('article');s.append(el('h3',m.title),el('p',`${m.observationKind}：${m.period} · 單位：${m.unit} · 資料庫更新：${m.updatedAt} · 下載：${new Date(m.fetchedAt).toLocaleString('zh-TW')}`),table(['序列','最新觀測值'],m.series.map(x=>[x.name,fmt(x.value)])));return s}));filter();
$('#sources').replaceChildren(...d.sources.map(s=>{const p=el('p'),a=el('a',s.name);a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';p.append(a,document.createTextNode(`｜${s.stale?'待更新／更新失敗':'已下載'}｜${s.fetchedAt??'無快取'} ${s.error??''}`));return p}));}
function filter(){const q=$('#filter').value.trim(),rows=current.indices.filter(x=>(x.name+x.category).includes(q));$('#count').textContent=`${rows.length} 個指數，均為收盤快照。包含可取得的櫃買指數；各來源日期可能不同。`;$('#indices').replaceChildren(table(['指數','收盤','漲跌幅 %','交易日','分類'],rows.map(r=>[r.name,fmt(r.close),fmt(r.changePercent),r.date,r.category])))}
$('#filter').oninput=filter;async function load(refresh=false){$('#refresh').disabled=true;$('#status').textContent=refresh?'正在下載官方資料，約需數十秒…':'正在讀取快取…';try{const r=await fetch('/api/hub/'+(refresh?'refresh':'state'),refresh?{method:'POST'}:{});const d=await r.json();if(!r.ok)throw new Error(d.error);render(d);$('#status').textContent='資料已載入，研究頁可勾選加入本次分析。'}catch(e){$('#status').textContent=e.message}finally{$('#refresh').disabled=false}}
async function monitorAPI(path,body){const r=await fetch('/api/monitor/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
async function monitorState(){const d=await monitorAPI('state');$('#monitor-enabled').checked=d.config.enabled;$('#monitor-interval').value=d.config.intervalMinutes;$('#monitor-threshold').value=d.config.indexThreshold;$('#monitor-status').textContent=(d.config.enabled?'本機定時觀測已啟用':'定時觀測關閉')+'；上次檢查：'+(d.observed.lastCheckedAt??'尚未執行');$('#events').replaceChildren(...d.events.map(e=>{const a=el('article');a.append(el('h3',e.title),el('p','期間：'+e.period+' · '+e.note));return a}));}
async function monitorAction(button,fn){button.disabled=true;$('#monitor-status').textContent='處理中…';try{await fn();await monitorState()}catch(e){$('#monitor-status').textContent=e.message}finally{button.disabled=false}}
$('#monitor-save').onclick=()=>monitorAction($('#monitor-save'),()=>monitorAPI('config',{enabled:$('#monitor-enabled').checked,intervalMinutes:Number($('#monitor-interval').value),indexThreshold:Number($('#monitor-threshold').value)}));
$('#monitor-check').onclick=()=>monitorAction($('#monitor-check'),async()=>{await monitorAPI('check',{});await load()});
$('#refresh').onclick=()=>load(true);load();monitorState().catch(e=>$('#monitor-status').textContent=e.message);
</script></html>
