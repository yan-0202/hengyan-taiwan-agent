<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2712%27 fill=%27%237361d9%27/%3E%3Cpath d=%27M10 28V13M10 28H30M14 22L20 16L25 19L31 11%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>研究控制中心｜衡研</title><link rel="stylesheet" href="/assets/ui.css"><script type="module" src="/assets/ui.mjs"></script><main><nav><a href="/">← 市場總覽</a><a href="/ai">AI 團隊設定</a><a href="/workspace">團隊研究</a><a href="/data">官方資料與觀測</a></nav><h1>研究控制中心</h1><p>先規劃、核對證據，再產出結論。每個功能標示實際完成程度。</p><div id="status" role="status" aria-live="polite"></div><p class="notice">目前定位為個人研究工具。沒有自動交易、投資組合調整或已驗證的 KYC／AML 流程，也不承諾零幻覺與毫秒級分析。</p>
<section><h2>架構能力地圖</h2><div id="capabilities" class="grid"></div></section>
<section><h2>研究任務規劃</h2><p>把問題轉為固定檢查流程與角色分工；目前不會自動執行或呼叫 AI。</p><label for="question">想研究什麼？</label><textarea id="question" placeholder="例如：比較台積電兩期財報，分析現金流與營收變化。"></textarea><button id="plan">建立研究計畫（不呼叫 AI）</button><div id="planresult"></div><details><summary>已保存的計畫</summary><div id="history"></div></details></section>
<div class="grid"><section><h2>財務計算工具</h2><label for="kind">計算項目</label><select id="kind"><option value="growth">成長率</option><option value="margin">毛利率</option><option value="percentagePoints">百分點變化</option></select><label id="alabel" for="previous">前期數值</label><input id="previous" type="number" step="any"><label id="blabel" for="current">本期數值</label><input id="current" type="number" step="any"><button id="calculate">計算並保存公式紀錄</button><pre id="calcresult">輸入需使用相同期間類型、幣別與單位；程式不會自動辨識口徑。</pre></section>
<section><h2>你的研究偏好</h2><p>只保存你主動輸入的研究偏好，暫不自動傳給 AI。不需填帳號、證件或完整資產資料。</p><label for="market">市場</label><input id="market" value="台股"><label for="horizon">觀察期間</label><select id="horizon"><option>每日收盤</option><option>數週至數月</option><option>一年以上</option></select><label for="focus">關注項目</label><textarea id="focus" maxlength="500" placeholder="例如：現金流、匯率影響、電子產業"></textarea><label><input id="consent" type="checkbox"> 同意將這些偏好保存在本機</label><button id="saveprofile">保存研究偏好</button><button id="clearprofile" class="secondary">清除研究偏好</button></section></div></main>
<script type="module">
const $=s=>document.querySelector(s);const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
async function api(path,body){const r=await fetch('/api/research/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
async function act(button,fn){button.disabled=true;$('#status').textContent='處理中…';try{await fn();$('#status').textContent='操作完成，未呼叫 AI。'}catch(e){$('#status').textContent=e.message}finally{button.disabled=false}}
function show(p){$('#planresult').replaceChildren(el('h3',p.question),el('p',p.type),...p.steps.map(s=>{const d=el('div');d.className='step';d.append(el('strong',s.role+'｜'+s.task),el('p','必要資料：'+s.needs.join('、')),el('small',s.status));return d}),el('p','發布狀態：不可發布；'+p.limitations.join('；')))}
async function history(){const items=await api('plans');$('#history').replaceChildren(...items.map(p=>{const b=el('button',p.question);b.className='secondary';b.onclick=()=>show(p);return b}))}
$('#plan').onclick=()=>act($('#plan'),async()=>{show(await api('plan',{question:$('#question').value}));await history()});
$('#kind').onchange=()=>{const margin=$('#kind').value==='margin';$('#alabel').textContent=margin?'營收':'前期數值';$('#blabel').textContent=margin?'毛利':'本期數值'};
$('#calculate').onclick=()=>act($('#calculate'),async()=>{const r=await api('calculate',{kind:$('#kind').value,previous:$('#previous').value,current:$('#current').value});$('#calcresult').textContent=`結果：${r.value.toFixed(4)} ${r.unit}\n公式：${r.formula}\n輸入：${JSON.stringify(r.inputs)}\n紀錄：${r.id}`});
function fill(p){$('#market').value=p?.market??'台股';$('#horizon').value=p?.horizon??'每日收盤';$('#focus').value=p?.focus??'';$('#consent').checked=p?.consent===true}
$('#saveprofile').onclick=()=>act($('#saveprofile'),async()=>{const r=await api('profile',{market:$('#market').value,horizon:$('#horizon').value,focus:$('#focus').value,consent:$('#consent').checked});fill(r.profile)});
$('#clearprofile').onclick=()=>act($('#clearprofile'),async()=>{await api('profile',{clear:true});fill(null)});
try{const s=await api('state');$('#capabilities').replaceChildren(...s.capabilities.map(c=>{const a=el('article');const badge=el('span',c.state);badge.className='badge';a.append(badge,el('h3',c.name),el('p',c.detail));return a}));fill(s.profile);await history();$('#status').textContent='控制中心已就緒。'}catch(e){$('#status').textContent=e.message}
</script></html>
